<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Хувийн санхүү бүртгэл</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="roboto-regular">

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-5">

                <div class="card shadow">
                    <div class="card-body">

                        <h3 class="card-title text-center mb-4 fw-bold text-success">
                            <i class="fa-brands fa-cash-app"></i>
                            Хувийн санхүү бүртгэл
                        </h3>

                        <p class="text-muted text-center small mb-4">
                            Нэвтрэх эсвэл шинээр бүртгүүлэх
                        </p>

                        <form id="auth-form">

                            <div class="mb-3">
                                <label for="email" class="form-label small fw-semibold">
                                    Имэйл
                                </label>

                                <input
                                    type="email"
                                    class="form-control form-control-lg"
                                    id="email"
                                    placeholder="name@gmail.com"
                                    required>
                            </div>

                            <div class="mb-4">
                                <label for="password" class="form-label small fw-semibold">
                                    Нууц үг
                                </label>

                                <input
                                    type="password"
                                    class="form-control form-control-lg"
                                    id="password"
                                    placeholder="******"
                                    required>
                            </div>

                            <div class="d-grid gap-2">
                                <button
                                    type="submit"
                                    id="btn-login"
                                    class="btn btn-success btn-lg fw-semibold">
                                    Нэвтрэх
                                </button>

                                <button
                                    type="button"
                                    id="btn-register"
                                    class="btn btn-outline-secondary">
                                    Шинээр бүртгүүлэх
                                </button>
                            </div>

                        </form>

                        <div id="message"
                             class="text-danger text-center small mt-3 fw-medium">
                        </div>

                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/auth.js"></script>
    <script src="https://kit.fontawesome.com/9d054b26f1.js" crossorigin="anonymous"></script>

</body>
</html>
